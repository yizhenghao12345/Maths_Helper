services:
  app:
    image: ghcr.io/yizhenghao12345/maths_helper:main
    container_name: maths-helper-prod
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:80"
    volumes:
      # 持久化 SQLite 数据，避免重部署丢失（容器内路径见 api/db.py: api/data/）
      - ./data:/app/api/data
    healthcheck:
      # 经 nginx 代理访问后端 /health（nginx.conf 将 /api/ 去前缀转发到 :8000）
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
