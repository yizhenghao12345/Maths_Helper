services:
  app:
    image: ccr.ccs.tencentyun.com/aistudy/maths_helper:dev
    container_name: maths-helper-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 默认值：DeepSeek v4 Flash（免费额度），仅需在 .env 中配置 AI_API_KEY 即可
      AI_PROVIDER: deepseek
      AI_BASE_URL: https://api.deepseek.com/v1
      AI_MODEL: deepseek-v4-flash
      # 默认值：MiniMax-M3 多模态 OCR（需在 .env 中配置 OCR_API_KEY；不配则降级到 Tesseract）
      OCR_PROVIDER: minimax
      OCR_BASE_URL: https://api.minimaxi.com/v1
      OCR_MODEL: MiniMax-M3
    ports:
      - "18080:80"
    volumes:
      # 持久化 SQLite 数据，避免重部署丢失（容器内路径见 api/db.py: api/data/）
      - ./data:/app/api/data
    healthcheck:
      # 直接检查后端，避免高频经 nginx 代理刷 /health 日志
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 5m
      timeout: 3s
      retries: 2
      start_period: 30s
    labels:
      - "com.centurylinklabs.watchtower.scope=dev"

  # Watchtower：自动检测腾讯云 CCR 新镜像并重启更新
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower-dev
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --cleanup --scope dev
