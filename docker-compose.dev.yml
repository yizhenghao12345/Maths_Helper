services:
  app:
    image: ccr.ccs.tencentyun.com/aistudy/maths_helper:dev
    container_name: maths-helper-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 默认值：DeepSeek v4 Flash（免费额度），仅需在 .env 中配置 AI_API_KEY 即可
      AI_PROVIDER: deepseek
      AI_BASE_URL: https://api.deepseek.com/v1
      AI_MODEL: deepseek-v4-flash
    ports:
      - "18080:80"
    volumes:
      # 持久化 SQLite 数据，避免重部署丢失（容器内路径见 api/db.py: api/data/）
      - ./data:/app/api/data
    healthcheck:
      # 经 nginx 代理访问后端 /health（nginx.conf 将 /api/ 去前缀转发到 :8000）
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "com.centurylinklabs.watchtower.scope=dev"

  # Watchtower：自动检测腾讯云 CCR 新镜像并重启更新
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower-dev
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --cleanup --scope dev
