name: Build and Deploy

on:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

env:
  # 腾讯云 CCR 个人版镜像仓库
  IMAGE_NAME: ccr.ccs.tencentyun.com/aistudy/maths_helper

jobs:
  build:
    name: Build and Push Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Tencent CCR
        uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TENCENT_REGISTRY_USERNAME }}
          password: ${{ secrets.TENCENT_REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  # 仅当配置了 VPS_HOST 时才 SSH 部署；否则依赖 Watchtower 自动拉取新镜像
  deploy-dev:
    name: Deploy to Dev
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_name == 'dev'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check VPS configured
        id: check_vps
        run: echo "has_vps=${{ secrets.VPS_HOST != '' }}" >> "$GITHUB_OUTPUT"

      - name: Prepare SSH key
        if: steps.check_vps.outputs.has_vps == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy compose file
        if: steps.check_vps.outputs.has_vps == 'true'
        run: |
          scp -P "${{ secrets.VPS_PORT }}" \
            -i ~/.ssh/deploy_key \
            docker-compose.dev.yml \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_APP_DIR_DEV }}/docker-compose.yml

      - name: Deploy on VPS
        if: steps.check_vps.outputs.has_vps == 'true'
        run: |
          ssh -p "${{ secrets.VPS_PORT }}" \
            -i ~/.ssh/deploy_key \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
              set -e
              cd "${{ secrets.VPS_APP_DIR_DEV }}"
              # AI 密钥等配置改为在服务器本地 .env 维护，部署不再覆盖；缺失时仅创建空文件占位（保留 AI 降级）
              [ -f .env ] || touch .env
              docker compose pull
              docker compose up -d
              docker image prune -f
          EOF

  deploy-prod:
    name: Deploy to Prod
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check VPS configured
        id: check_vps
        run: echo "has_vps=${{ secrets.VPS_HOST != '' }}" >> "$GITHUB_OUTPUT"

      - name: Prepare SSH key
        if: steps.check_vps.outputs.has_vps == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy compose file
        if: steps.check_vps.outputs.has_vps == 'true'
        run: |
          scp -P "${{ secrets.VPS_PORT }}" \
            -i ~/.ssh/deploy_key \
            docker-compose.prod.yml \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_APP_DIR_PROD }}/docker-compose.yml

      - name: Deploy on VPS
        if: steps.check_vps.outputs.has_vps == 'true'
        run: |
          ssh -p "${{ secrets.VPS_PORT }}" \
            -i ~/.ssh/deploy_key \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
              set -e
              cd "${{ secrets.VPS_APP_DIR_PROD }}"
              # AI 密钥等配置改为在服务器本地 .env 维护，部署不再覆盖；缺失时仅创建空文件占位（保留 AI 降级）
              [ -f .env ] || touch .env
              docker compose pull
              docker compose up -d
              docker image prune -f
          EOF
