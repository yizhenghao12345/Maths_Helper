name: Build and Deploy
run-name: Build and Deploy ${{ github.ref_name }}

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maths-helper-${{ github.ref_name }}
  cancel-in-progress: true

env:
  # 腾讯云 CCR 个人版镜像仓库
  IMAGE_NAME: ccr.ccs.tencentyun.com/aistudy/maths_helper

jobs:
  build:
    name: Build and Push Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Tencent CCR
        uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TENCENT_REGISTRY_USERNAME }}
          password: ${{ secrets.TENCENT_REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 仅当配置了 VPS_HOST 时才 SSH 部署；否则依赖 Watchtower 自动拉取新镜像
  deploy:
    name: Deploy to ${{ github.ref_name == 'dev' && 'Dev' || 'Prod' }}
    needs: build
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: ${{ github.ref_name == 'dev' && 'docker-compose.dev.yml' || 'docker-compose.prod.yml' }}
      APP_DIR: ${{ github.ref_name == 'dev' && secrets.VPS_APP_DIR_DEV || secrets.VPS_APP_DIR_PROD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check VPS configured
        id: check_vps
        run: echo "has_vps=${{ secrets.VPS_HOST != '' }}" >> "$GITHUB_OUTPUT"

      - name: Show deployment mode
        run: |
          if [ "${{ steps.check_vps.outputs.has_vps }}" = "true" ]; then
            echo "SSH deploy enabled for ${{ github.ref_name }}: $APP_DIR"
          else
            echo "VPS_HOST is not configured. Image has been pushed; deployment relies on Watchtower pulling tag ${{ github.ref_name }}."
          fi

      - name: Prepare SSH key
        if: steps.check_vps.outputs.has_vps == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy compose file
        if: steps.check_vps.outputs.has_vps == 'true'
        run: |
          scp -P "${{ secrets.VPS_PORT }}" \
            -i ~/.ssh/deploy_key \
            "$COMPOSE_FILE" \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:"$APP_DIR"/docker-compose.yml

      - name: Deploy on VPS
        if: steps.check_vps.outputs.has_vps == 'true'
        run: |
          ssh -p "${{ secrets.VPS_PORT }}" \
            -i ~/.ssh/deploy_key \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
              set -e
              cd "${{ env.APP_DIR }}"
              # AI 密钥等配置改为在服务器本地 .env 维护，部署不再覆盖；缺失时仅创建空文件占位（保留 AI 降级）
              [ -f .env ] || touch .env
              docker compose pull
              docker compose up -d
              docker image prune -f
          EOF
